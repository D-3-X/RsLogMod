name: Run Tests and Update Badge

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel

      - name: Run Tests
        run: |
          python RsLogMod/tests/test_script.py

      - name: Update badge on success
        if: success()
        run: echo "Tests passed, update the badge!"
        
      - name: Handle failure
        if: failure()
        run: echo "Tests failed, updating the badge accordingly."
