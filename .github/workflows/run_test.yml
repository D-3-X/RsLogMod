name: Run Tests and Update Badge

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v3  # Updated to v3 to remove Node.js 12 deprecation warnings

      - name: Set up Python
        uses: actions/setup-python@v4  # Updated to v4 to use supported Node.js versions
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel

      - name: Run Tests
        run: |
          python RsLogMod/tests/test_script.py

      - name: Update badge on success
        if: success()  # Only run if the tests are successful
        run: echo "Tests passed, update the badge!"
        
      - name: Handle failure
        if: failure()  # Run only if tests fail
        run: echo "Tests failed, updating the badge accordingly."
