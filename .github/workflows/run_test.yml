name: Run RsLogMod Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Tests
        run: |
          python RsLogMod/tests/test_script.py

      - name: Success message
        if: success()
        run: echo "All tests passed. Badge will reflect success."

      - name: Failure message
        if: failure()
        run: echo "Some tests failed. Badge will reflect failure."
